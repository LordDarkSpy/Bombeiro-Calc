<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Venda — Corpo de Bombeiros Oasis RP</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

<header class="topo">
  <div class="topo-conteudo">
    <img class="brasao" src="img/logo.png" alt="Brasão do Corpo de Bombeiros — Oasis RP" width="72" height="72">
    <div>
      <h1>Corpo de Bombeiros — Oasis RP</h1>
      <p class="subtitulo">Calculadora de Venda de Suprimentos</p>
    </div>
  </div>
</header>

<main class="container">

  <section id="lista-itens" class="cartao lista-itens" aria-live="polite">
    <p class="carregando">Carregando itens...</p>
  </section>

  <div class="coluna-lateral">
  <aside class="cartao resumo">
    <h2>Resumo do Pedido</h2>
    <ul id="resumo-lista" class="resumo-lista">
      <li class="resumo-vazio">Nenhum item selecionado</li>
    </ul>
    <div class="resumo-total">
      <span>Total</span>
      <strong id="total-valor">$0,00</strong>
    </div>
    <button id="copiar" type="button" class="botao-copiar">📋 Copiar valor total</button>
    <button id="limpar" type="button" class="botao-limpar">Limpar tudo</button>
  </aside>

  <section class="cartao link-imagem">
    <h2>Imagem para enviar</h2>
    <a href="img/Tabela_Bombeiros.png" target="_blank" rel="noopener">
      <img class="link-preview" src="img/Tabela_Bombeiros.png" alt="Tabela de preços dos Bombeiros">
    </a>
    <input id="link-campo" class="link-campo" type="text" readonly value="https://lorddarkspy.github.io/Bombeiro-Calc/img/Tabela_Bombeiros.png" aria-label="Link da imagem">
    <button id="copiar-link" type="button" class="botao-copiar">📋 Copiar link da imagem</button>
  </section>
  </div>

</main>

<footer class="rodape">
  <p>Corpo de Bombeiros — Oasis RP</p>
</footer>

<script src="js/script.js?v=5"></script>
</body>
</html>
